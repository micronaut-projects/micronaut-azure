plugins {
    id 'io.micronaut.build.internal.azure-module'
}

dependencies {
    annotationProcessor(mn.micronaut.inject.java)
    api(libs.managed.azure.cosmos)
    testCompileOnly(mn.micronaut.inject.groovy)
    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(platform(mnTestResources.boms.testcontainers))
    testImplementation(libs.testcontainers.azure)

    constraints {
        implementation("io.projectreactor.netty:reactor-netty-http:1.2.10") {
            because("Older versions have CVEs")
        }
    }
    runtimeOnly("io.projectreactor.netty:reactor-netty-http:1.2.10")
}
