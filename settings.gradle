pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.0.0-M17'
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

rootProject.name = 'azure-parent'

include 'azure-bom'
include 'azure-cosmos'
include 'azure-function'
include 'azure-function-http'
include 'azure-function-http-test'
include 'azure-logging'
include 'azure-sdk'
include 'azure-secret-manager'
include 'azure-tracing'
include 'doc-examples:example-java'
include 'doc-examples:example-groovy'
include 'doc-examples:example-kotlin'
include("test-suite-azure-function-http-context-path")
// include("test-suite-dockerised")
/*
Disabled until Azure Gradle Plugin supports Gradle 9
https://github.com/microsoft/azure-gradle-plugins/issues/184

Caused by: java.lang.NoClassDefFoundError: org/gradle/api/plugins/JavaPluginConvention
	at com.microsoft.azure.plugin.functions.gradle.util.GradleProjectUtils.convert(GradleProjectUtils.java:33)
	at com.microsoft.azure.plugin.functions.gradle.GradleFunctionContext.<init>(GradleFunctionContext.java:45)
	at com.microsoft.azure.plugin.functions.gradle.task.PackageTask.build(PackageTask.java:43)
 */
include("test-suite-http-server-tck-azure-function-http")
include("test-suite-http-server-tck-azure-function-http-test")

micronautBuild {
    // Required for 4.0.0-SNAPSHOT, can be removed after
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-servlet")
    importMicronautCatalog("micronaut-tracing")
    importMicronautCatalog("micronaut-validation")
}
